name: "GitHub Yak Action"
description: 'A Github Action that checks your repository for certains files'
author: jonasbn
inputs:
  yak-arguments:  # id of input
    description: 'Arguments for yak'
    required: false
branding:
  color: green
  icon: check-square
runs:
  using: docker
  image: 'docker://jonasbn/yak@sha256:89f02b4f7c3a00c0944c9da725627f6ff55216063fb22e2c13a94a52536a2070' # jonasbn/yak:latest as of 2026-11-11
  args:
    - ${{ inputs.yak-arguments }}
