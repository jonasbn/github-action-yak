name: Yak Analysis

on:
  push:
    branches:
      - main

permissions:
  contents: read
 
jobs:
  Yak:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    -
      name: Running Yak analysis
      uses: ./
      with:
        yak-arguments: '--config=.yak.yaml'
