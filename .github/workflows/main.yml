name: Yak Analysis

on:
  push:
    branches:
      - main

permissions:
  contents: read
 
jobs:
  Yak:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    -
      name: Running Yak analysis
      uses: ./
      with:
        yak-arguments: '--config=.yak.yaml'
