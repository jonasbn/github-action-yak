name: Yak Analysis

on:
  push:
    branches:
      - main

permissions:
  contents: read
 
jobs:
  Yak:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      name: Running Yak analysis
      uses: ./
      with:
        yak-arguments: '--config=.yak.yaml'
